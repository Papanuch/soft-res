[project]
name = "soft-res"
version = "1.0.0"
description = "Soft - Res : réseau d'avocats partenaires (application de bureau)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlmodel>=0.0.22",
  "pydantic-settings>=2.4",
  "platformdirs>=4.2",
  "cryptography>=43",
  "rapidfuzz>=3.9",
  "anthropic>=0.60",
  "pywebview>=5.2",
]

[project.scripts]
soft-res = "soft_res.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["soft_res"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
